services:
  db:
    image: postgres:17-alpine
    env_file:
      - ./core/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - adurys_net

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file:
      - ./core/.env
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,https://*.ngrok-free.app,https://*.ngrok.io
      REDIS_URL: redis://redis:6379/1
      DB_HOST: db
      DB_PORT: "5432"
      CONN_MAX_AGE: "0"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - adurys_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - adurys_net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NODE_ENV: development
      PORT: "3001"
    ports:
      - "3001:3001"
    networks:
      - adurys_net

  redis:
    image: redis:7-alpine
    networks:
      - adurys_net

  celery_worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: celery -A core worker -l info
    env_file:
      - ./core/.env
    environment:
      DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DB_HOST: db
    depends_on:
      - db
      - redis
    networks:
      - adurys_net

  celery_beat:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: celery -A core beat -l info
    env_file:
      - ./core/.env
    environment:
      DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DB_HOST: db
    depends_on:
      - db
      - redis
    networks:
      - adurys_net

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - core
      - frontend
      - admin
    networks:
      - adurys_net

volumes:
  postgres_data:

networks:
  adurys_net:
    driver: bridge